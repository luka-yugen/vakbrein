<rect class="card" x="860" y="184" width="300" height="76" rx="12" stroke-width="1.5"/><text class="acc" x="884" y="216" font-size="17" font-weight="600">/vakbrein examen</text><text class="dim" x="884" y="240" font-size="14">oefenen in de echte examenvorm</text>
