<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Werkwijze: bronnen worden door scripts omgezet, de AI schrijft het brein, en jij gebruikt het voor vragen, oefenexamens en de studiepagina">
<style>
.bg{fill:#f6f7f9}.card{fill:#fff;stroke:#dde1e8}.tx{fill:#1b1f29}.dim{fill:#5d6577}.acc{fill:#2f6bd8}.ok{fill:#1b8a66}.ln{stroke:#c9ced8}.node{fill:#fff;stroke:#5d6577}.nodea{fill:#2f6bd8}.nodeo{fill:#1b8a66}.pill{fill:#eef0f4;stroke:#dde1e8}.arrow{stroke:#2f6bd8;fill:none}.ah{fill:#2f6bd8}
