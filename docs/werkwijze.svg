<circle class="node" cx="468" cy="113" r="4"/><text class="tx" x="482" y="118" font-size="17">Lessen/</text>
<circle class="nodea" cx="468" cy="149" r="4"/><text class="tx" x="482" y="154" font-size="17">Concepts/</text>
<circle class="nodea" cx="468" cy="185" r="4"/><text class="tx" x="482" y="190" font-size="17">Oefeningen/</text>
