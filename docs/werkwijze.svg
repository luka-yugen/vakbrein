<path class="arrow" d="M768 200 H848" stroke-width="2.5"/><path class="ah" d="M852 200 l-12 -7 v14z"/>
<rect class="pill" x="40" y="394" width="1120" height="44" rx="12" stroke-width="1.5"/>
<text class="tx" x="600" y="422" font-size="16" text-anchor="middle"><tspan class="mono acc">SCHEMA.md</tspan> en <tspan class="mono acc">AGENTS.md</tspan> gaan mee in elk brein: de regels, leesbaar voor elke AI</text>
